title: Process Masquerading as Linux Kernel Worker Thread
id: 8f3b1c20-5d4a-4a21-9f6e-portfolio0002
status: experimental
description: >
  Detects a userland process whose name imitates a kernel worker thread
  (e.g. "[kworker/0:2]"). Genuine kworker threads are kernel-owned and have no
  on-disk executable; a real process using that name is masquerading. Behaviour
  observed in the whack.sh dropper (Malware-Analysis-001).
author: Beltus Bejanga
date: 2026/10/06
references:
  - https://attack.mitre.org/techniques/T1036/004/
  - Malware-Analysis-001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|contains: '[kworker/'
  # A legitimate kworker has no Image path on disk; a process_creation event
  # with an executable image whose name is a kworker string is the anomaly.
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
level: high
tags:
  - attack.defense_evasion
  - attack.t1036.004
falsepositives:
  - Rare: monitoring agents that deliberately label helper threads this way
